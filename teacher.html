<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 대시보드</title><link rel="stylesheet" href="./styles.css"><style>.teacher-page{max-width:1250px;margin:28px auto;padding:0 20px}.teacher-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}.login-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.controls-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.control-item{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center}.toggle{border:0;border-radius:999px;padding:9px 16px;font-weight:900}.toggle.open{background:#dff5ea;color:#1f7859}.toggle.locked{background:#e8ecea;color:#59645f}.teacher-table{width:100%;border-collapse:collapse;min-width:850px}.teacher-table th,.teacher-table td{border-bottom:1px solid #e4e9e6;padding:11px;text-align:left}.teacher-table th{background:#f2f6f3}.table-scroll{overflow-x:auto}.status-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:#999}.status-dot.live{background:#2f9d72}.status-dot.away{background:#e5a82d}.secondary{border:1px solid #bfcac5;background:#fff;border-radius:10px;padding:9px 13px;font-weight:800}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.login-grid,.controls-grid{grid-template-columns:1fr}}</style></head><body><main class="teacher-page"><section class="teacher-card"><h1>교사 대시보드</h1><p>교사 계정으로 로그인합니다.</p><div class="login-grid"><div><label>이메일</label><input id="teacherEmail" type="email"></div><div><label>비밀번호</label><input id="teacherPassword" type="password"></div><button id="teacherLogin" class="primary">로그인</button></div><p id="teacherLoginMsg" class="feedback"></p></section>
<section class="teacher-card"><div class="toolbar"><div><h2>활동 열기 / 잠그기</h2><p>학생은 열려 있는 활동만 조작할 수 있습니다.</p></div><div class="toolbar-actions"><button id="openNext" class="secondary">다음 활동 하나 열기</button><button id="lockAll" class="secondary">모두 잠그기</button></div></div><div id="controlGrid" class="controls-grid"></div></section>
<section class="teacher-card"><div class="toolbar"><div><h2>학생 접속 현황</h2><p>최근 접속과 이탈, 제출 상태를 확인합니다.</p></div><button id="refreshTeacher" class="secondary">새로고침</button></div><div class="table-scroll"><table class="teacher-table"><thead><tr><th>학번</th><th>상태</th><th>접속 시각</th><th>마지막 확인</th><th>현재 활동</th><th>이탈 횟수</th><th>제출</th></tr></thead><tbody id="sessionRows"><tr><td colspan="7">로그인 후 표시됩니다.</td></tr></tbody></table></div></section><section class="teacher-card"><h2>생각 더 나아가기 제출</h2><div id="reflectionList">제출된 답안이 없습니다.</div></section></main><script type="module" src="./teacher.js"></script></body></html>
